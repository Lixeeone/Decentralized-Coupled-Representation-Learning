# Original feature archive required for exact manuscript comparison.
name: bert-features
seed: 0
steps: 15000
log_every: 500
checkpoint_every: 1000
output: results/bert
target: final
plot: true
protocol_origin: paper ambient dimension, N and rank; reconstruction of unspecified
  step sizes and preprocessing
data:
  kind: features
  path: data/bert.npy
  preprocess: standardize
  sha256: null
  expected_dim: 768
  expected_samples: 127600
domain:
  kind: ball
dynamics:
  rank: 32
  eta_x: 0.002
  eta_w: 1.0e-05
  diffusion: 0.0001
  beta: 1.0
  init_scale: 0.8
  stabilize_every: null
