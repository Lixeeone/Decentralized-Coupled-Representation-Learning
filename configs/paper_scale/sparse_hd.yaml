# Explicit release configuration; see docs/PAPER_MAPPING.md.
name: paper-scale-sparse_hd
seed: 0
steps: 15000
log_every: 500
checkpoint_every: 1000
output: results/paper-scale-sparse_hd
target: final
plot: true
protocol_origin: N,n,m,horizon from manuscript; unspecified parameters reconstructed,
  not exact table reproduction
data:
  kind: sparse_hd
  n_samples: 1024
  preprocess: standardize
  dim: 1000
  intrinsic_dim: 50
  noise: 0.1
domain:
  kind: ball
dynamics:
  rank: 50
  eta_x: 0.002
  eta_w: 1.0e-05
  diffusion: 0.0001
  beta: 1.0
  init_scale: 0.8
  stabilize_every: null
