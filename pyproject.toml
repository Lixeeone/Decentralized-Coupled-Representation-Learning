[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcrl"
version = "0.1.0"
description = "Decentralized Coupled Representation Learning: numerical algorithms and invariant diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "threadpoolctl>=3,<4"]

[project.scripts]
dcrl = "dcrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

