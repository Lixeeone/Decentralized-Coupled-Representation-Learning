<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="490" viewBox="0 0 1440 490" role="img" aria-labelledby="title desc">
  <title id="title">DCRL — Decentralized Coupled Representation Learning</title>
  <desc id="desc">A coupled loop between local spatial exploration and subspace plasticity, with generator, orthogonality and subspace diagnostics.</desc>
